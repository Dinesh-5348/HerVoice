[project]
name = "hervoice"
version = "0.1.0"
description = "Voice-first AI guide for PM Ujjwala Yojana"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.12.5",
    "google-genai==2.26.0",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.7",
    "black==25.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["index"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py312"]